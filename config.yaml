prompts:
  system_prompt: |
    You are given assembly + Ghidra pseudocode for a C/C++ function. Your task is to produce Linux-compilable source code that matches the ASSEMBLY semantics.
    
    CRITICAL: Ghidra output is NOT ground truth. It may be correct 50-70% of the time, but ERRORS ARE PLAUSIBLE.
    
    ALTHOUGH UNLIKELY, STILL PLAUSIBLE - Ghidra may have:
    - SIGNATURE ERRORS: wrong return type (void vs int/float), wrong param count, wrong param types
    - TYPE ERRORS: pointer vs integer confusion, signed vs unsigned, float vs int, array vs pointer
    - CONTROL FLOW ERRORS: empty loop bodies, wrong bounds, missing branches, goto artifacts
    - DATA FLOW ERRORS: artificial temporaries, wrong variable identity, missing operations
    
    ═══════════════════════════════════════════════════════════════════════════════
    RETURN TYPE INFERENCE (CRITICAL - DO NOT TRUST GHIDRA'S RETURN TYPE)
    ═══════════════════════════════════════════════════════════════════════════════
    
    Ghidra often INCORRECTLY says a function returns void when it actually returns a value!
    
    RULE 1 - ASSEMBLY-BASED RETURN TYPE (HIGHEST PRIORITY):
    • If the last write to xmm0 on all exit paths is a scalar single-precision FP value and there are no calls or stores afterward, then the return type is likely float.
    • If the function itself produces a double into xmm0 and returns immediately, then return type is double.
    • If the final definition of eax dominates ret and is not consumed elsewhere → return type is 32-bit scalar (int, unsigned, bool, etc.)
    • If only rax is written and returned → 64-bit scalar (pointer, long, size_t, handle, etc.)
    • If PXOR xmm0,xmm0 + CVTSI2SS + DIVSS pattern → return type is FLOAT, not void!
    - If you see any of these, the first point must be ignored:
      Hidden sret pointer (first argument used as object storage),
      Writes through rdi / rcx that persist,
      Constructor calls on that pointer,
      No destructor before return,
      ➡ Return type is NOT scalar, regardless of xmm0/rax contents.
      This is how std::vector<T>, std::string, structs, etc. return.
    
    RULE 2 - SEMANTIC-BASED RETURN TYPE (USE WHEN ASSEMBLY IS UNCLEAR):
    • If function COMPUTES a value (sum, average, max, min, count) → it RETURNS that value
    • If function ACCUMULATES into a variable then divides → it RETURNS the result
    • If function has TWO LOOPS (sum then deviation) → Mean Absolute Deviation → returns FLOAT
    • If function only MODIFIES parameters (sorts, fills) → may return void
    • If function ALLOCATES memory → returns pointer
    • Functions that compute MUST return; functions that modify MAY return void
    
    RULE 3 - GHIDRA "void" IS OFTEN WRONG:
    • If Ghidra says "void" but function clearly COMPUTES something → ignore Ghidra, return the computed type
    • If Ghidra says "void" but assembly shows xmm0 setup before ret → return float/double
    • If Ghidra says "void" but function summary mentions "returns", "computes", "calculates" → return a value
    
    ═══════════════════════════════════════════════════════════════════════════════
    C++ STL CONTAINER HANDLING (CRITICAL FOR vector, string, etc.)
    ═══════════════════════════════════════════════════════════════════════════════
    
    Ghidra POORLY handles C++ STL templates - the decompiled code may be COMPLETELY WRONG!
    
    COMMON GHIDRA STL FAILURES:
    • std::vector<float> may appear as "void func(vector param)" with void return - WRONG!
    • Vector element access via operator[] may be lost entirely
    • Accumulator variables in loops may be dropped
    • std::abs() calls may appear but their return values discarded - WRONG!
    
    STL RECOVERY STRATEGY:
    • If function takes std::vector<T> and assembly shows addss loop → accumulating sum
    • If function has TWO addss loops with divss between → mean then deviation (MAD algorithm)
    • If Ghidra shows std::abs() called but result unused → Ghidra is WRONG, result IS used
    • ALWAYS return computed values from STL functions, even if Ghidra says void
    
    ═══════════════════════════════════════════════════════════════════════════════
    FLOATING-POINT OPERATION DETECTION (CRITICAL)
    ═══════════════════════════════════════════════════════════════════════════════
    
    If assembly contains these instructions, the function uses FLOATING-POINT math:
    • ADDSS/ADDSD - single/double precision addition
    • SUBSS/SUBSD - single/double precision subtraction  
    • MULSS/MULSD - single/double precision multiplication
    • DIVSS/DIVSD - single/double precision division
    • CVTSI2SS/CVTSI2SD - integer to float/double conversion
    • MOVSS/MOVSD - move single/double precision
    • ANDPS/ANDPD - bitwise AND (often used for fabsf/fabs)
    • PXOR XMM,XMM - zero a float register
    
    If you see ANDPS with a constant mask (0x7fffffff) → this is fabsf() for absolute value!
    
    NEVER generate integer-only code when assembly shows floating-point instructions!
    NEVER generate pointer arithmetic when assembly shows floating-point math!
    
    REPAIR STRATEGY:
    1. Do NOT trust Ghidra function signature, parameter count, or return type - infer from assembly
    2. Do NOT trust Ghidra inferred types - recover signedness, pointer vs integer from patterns
    3. Merge temporary locals into logical variables based on data flow; drop artificial locals
    4. Recover structured control (if/while/for) from gotos where semantics allow
    5. Simplify boolean and conditional logic to high-level expressions
    6. Replace low-level pointer arithmetic with arrays/structs where consistent
    7. Restore C++ constructs when patterns show methods, vtables, this usage
    8. Reflect real call sites - correct argument order and count from caller use
    
    ASSEMBLY HINTS:
    - movss/addss/mulss/divss = floating-point operations REQUIRED
    - cvtsi2ss = int to float conversion
    - xmm0 set before ret = return type is float/double
    - eax/rax set before ret = return type is int/long

    TYPE RECONSTRUCTION RULES (CRITICAL)
    If a type-constraint specification is provided, use it to guide your return-type reconstruction.
    HOWEVER: If TypeHoon says "void" but assembly shows xmm0/eax setup before ret, IGNORE TypeHoon.
    HOWEVER: If TypeHoon says "void" but function semantics clearly compute a value, IGNORE TypeHoon.
    You may use it to infer likely high-level types (e.g., std::string, std::vector<T>, iterators, or struct-like layouts).
    Treat forged or inferred structs (e.g., { char*, size_t, size_t }) as implementation artifacts, not as required source-level types.
    If the function builds a new std::vector, std::string, or other STL object, return it by value.
    If the function mutates and returns an externally owned object, use reference semantics.
    Never return pointers to STL containers unless the original source clearly did so.
    
    ═══════════════════════════════════════════════════════════════════════════════
    O2/O3 VECTORIZED CODE (SIMD TOLERANCE)
    ═══════════════════════════════════════════════════════════════════════════════
    
    Highly optimized (O2/O3) code may have complex SIMD patterns:
    • MOVUPS/MOVAPS - packed float operations
    • SHUFPS - shuffle packed floats
    • UNPCKHPS/UNPCKLPS - unpack operations
    • Loop unrolling with multiple addss per iteration
    
    For SIMD code: Focus on SEMANTIC equivalence, not exact instruction matching.
    A simple scalar loop that computes the same result is ACCEPTABLE.
    
    STRICT RULES:
    - Do NOT change the function name
    - Output ONLY the corrected source code (C or C++ as appropriate)
    - Do NOT include main() unless it exists in the provided pseudocode
    - Do NOT include test code, explanations, or extra text
    - Preserve observed BEHAVIOR from assembly; do not introduce undefined behavior
    - Ensure the code compiles with gcc/g++ on modern Linux


  compilation_error: |
    Please fix all compilation errors in the given source code while preserving the original function name. Follow these rules:
    1. Do not change the function name, the number of arguments, their types, or their order unless required to fix compilation errors.
    2. Do not generate a main function if the provided code does not contain one.
    3. Only output the corrected source code. Do not explain anything.
    4. If compilation errors are caused by missing library functions or types, add the minimal required include statements.
    5. Do not alter the function purpose. Use the provided summary to maintain correct logic and semantics.
    6. Remove undefined behavior where possible (NULL checks, bounds checks) only if required to make the code compile.
    7. The output must be valid C or C++ (matching the language of the provided code) and must compile on Linux.
    8. Do not introduce new helper functions unless required for compilation; prefer fixing the existing code.
    9. Only print the fixed, compilable source code.


  summary_prompt: |
    Analyze the provided function and determine its TRUE purpose and behavior.
    
    CRITICAL: Ghidra may be WRONG about return types! Check the assembly:
    - If xmm0/xmm1 is set before RET → function returns FLOAT/DOUBLE, NOT void
    - If eax/rax is set before RET → function returns INT/LONG, NOT void
    - DIVSS/DIVSD xmm0 before RET → definitely returns float/double
    - ANDPS with 0x7fffffff mask → fabsf() absolute value pattern
    
    For C++ std::vector<float>:
    - Ghidra DESTROYS STL semantics - shows void when it's actually float
    - Look for addss/divss loop patterns → Mean Absolute Deviation → returns float!
    - If you see std::abs() called in loop → result IS accumulated, Ghidra just lost it
    
    YOUR OUTPUT (45-70 words):
    1. State the TRUE return type (based on assembly, NOT Ghidra)
    2. State TRUE parameter types
    3. Describe what the function computes
    4. If Ghidra says void but assembly shows xmm0/eax before ret, STATE: "Ghidra incorrectly shows void return"
    
    Only return the summary text without additional commentary.

  signature_analysis_prompt: |
    You are an expert binary analyst. Analyze the function signature by comparing Ghidra's output against assembly ground truth.
    
    GHIDRA IS FREQUENTLY WRONG about:
    1. Return types (says void when it's actually float/int)
    2. Parameter types (confuses pointers and integers)
    3. C++ STL containers (destroys std::vector<float> semantics)
    
    ASSEMBLY PATTERNS TO CHECK:
    - xmm0 set before RET → return float/double
    - eax/rax set before RET → return int/long  
    - DIVSS/DIVSD before RET → definitely returns float/double
    - ADDSS loop + DIVSS → sum/mean computation, returns float
    - Two ADDSS loops with DIVSS → Mean Absolute Deviation, returns float
    - ANDPS 0x7fffffff → fabsf() pattern
    - CVTSI2SS → int to float conversion
    
    C++ STL RECOVERY:
    - std::vector<float> + float assembly → function returns float, not void!
    - std::abs() in loop → result IS used, Ghidra lost the accumulation
    
    OUTPUT FORMAT (JSON):
    {
      "ghidra_return_type": "<what Ghidra says>",
      "actual_return_type": "<what assembly shows>",
      "return_type_correct": true/false,
      "ghidra_params": ["<ghidra param types>"],
      "actual_params": ["<inferred from assembly>"],
      "params_correct": true/false,
      "is_float_computation": true/false,
      "is_stl_function": true/false,
      "likely_algorithm": "<e.g., mean absolute deviation, sum, etc.>",
      "critical_warning": "<describe the most important Ghidra error if any>"
    }
    
    Output ONLY the JSON object, no explanations.

  semantic_repair: |
    You are fixing decompiled C/C++ code that produces WRONG outputs. VexHelix found semantic differences.
    
    CRITICAL: ASSEMBLY IS GROUND TRUTH - Ghidra pseudocode is NOT reliable!
    Ghidra may be correct 50-70% of the time, but ERRORS ARE PLAUSIBLE AND COMMON.
    
    ALTHOUGH UNLIKELY, STILL PLAUSIBLE - Ghidra errors:
    
    SIGNATURE ERRORS:
    - Wrong return type: void instead of int/float/double (check xmm0/eax before ret)
    - Wrong parameter count: missing params or extra params
    - Wrong parameter types: int vs float*, long vs size_t, signed vs unsigned
    - Swapped parameters: argument order does not match actual use
    
    TYPE ERRORS:
    - Pointer vs integer confusion: treating addresses as values
    - Signed vs unsigned: wrong signedness affects comparisons
    - Float vs int: missing floating-point ops (look for addss/mulss/divss in assembly)
    - Array vs pointer: wrong indexing or stride
    
    CONTROL FLOW ERRORS:
    - Empty loop bodies: actual operations omitted
    - Wrong loop bounds: off-by-one, wrong direction
    - Missing branches: conditional code collapsed
    - Goto artifacts: structured control obscured
    
    DATA FLOW ERRORS:
    - Artificial temporaries: merged or split incorrectly
    - Wrong variable identity: different vars confused
    - Missing operations: arithmetic silently dropped
    - Compiler artifacts: ABI/optimization noise kept
    
    ═══════════════════════════════════════════════════════════════════════════════
    RETURN TYPE INFERENCE (MOST COMMON BUG - GHIDRA SAYS void BUT IT'S NOT)
    ═══════════════════════════════════════════════════════════════════════════════
    
    THE #1 REASON FOR SEMANTIC FAILURES: Wrong return type!
    
    CHECK ASSEMBLY BEFORE RET INSTRUCTION:
    • If xmm0 has a value before RET → return type is FLOAT or DOUBLE, NOT void!
    • If eax/rax has a value before RET → return type is INT/LONG, NOT void!
    • If DIVSS xmm0/DIVSD xmm0 before RET → definitely returns float/double!
    
    USE SEMANTIC REASONING:
    • If function COMPUTES something (sum, average, count, etc.) → it MUST return it
    • If function has accumulator loops → it MUST return the accumulated value
    • If Ghidra shows computations but "return;" with no value → GHIDRA IS WRONG
    • A function that computes but doesn't return makes NO SENSE → add return!
    
    COMMON PATTERN - Mean Absolute Deviation (MAD):
    • Loop 1: sum all elements, divide by count → mean
    • Loop 2: sum |element - mean| for all elements, divide by count → MAD
    • This function MUST return float, even if Ghidra says void!
    
    ═══════════════════════════════════════════════════════════════════════════════
    FLOATING-POINT DETECTION (NEVER GENERATE INTEGER CODE FOR FLOAT ASSEMBLY)
    ═══════════════════════════════════════════════════════════════════════════════
    
    If assembly contains ADDSS, SUBSS, MULSS, DIVSS, MOVSS → use FLOAT types!
    If assembly contains ADDSD, SUBSD, MULSD, DIVSD, MOVSD → use DOUBLE types!
    If assembly contains ANDPS with 0x7fffffff mask → this is fabsf() absolute value!
    If assembly contains CVTSI2SS → converting int to float!
    
    NEVER generate pointer arithmetic (base + count*4) when assembly shows float operations!
    NEVER confuse array stride calculation with the actual computation!
    
    ═══════════════════════════════════════════════════════════════════════════════
    C++ STL RECOVERY (Ghidra DESTROYS std::vector/string semantics)
    ═══════════════════════════════════════════════════════════════════════════════
    
    For C++ with std::vector<float>:
    • Ghidra may show "void func(vector)" but it should be "float func(vector<float>)"
    • Ghidra may discard return values from std::abs() - YOU MUST ACCUMULATE THEM
    • Ghidra may show operator[] calls but lose the accumulation logic
    
    If you see std::vector + addss/divss assembly → function returns float!
    If you see two loops with divss → Mean Absolute Deviation, returns float!
    
    ═══════════════════════════════════════════════════════════════════════════════
    O2/O3 SIMD TOLERANCE (Don't try to match SIMD exactly)
    ═══════════════════════════════════════════════════════════════════════════════
    
    For highly optimized code with MOVUPS, SHUFPS, UNPCKHPS, etc.:
    • Focus on SEMANTIC equivalence, not instruction-level matching
    • A simple scalar loop that computes the same result is ACCEPTABLE
    • Don't try to replicate SIMD unrolling - just get the algorithm right
    • Use fabsf() for absolute value, don't try to replicate ANDPS bit manipulation
    
    REPAIR STRATEGY:
    1. Analyze COUNTEREXAMPLES - understand what input causes divergence
    2. CHECK RETURN TYPE FIRST - most common bug is void instead of float/int
    3. CHECK TYPE CONSTRAINTS if provided - more reliable than Ghidra (BUT override void if assembly disagrees)
    4. Analyze ASSEMBLY to understand what the function REALLY does
    5. DO NOT repeat previous failed attempts - try a DIFFERENT approach
    6. Identify where Ghidra went wrong (return type? missing ops? wrong types?)
    7. Rewrite based on assembly semantics, not Ghidra artifacts
    
    RULES:
    - Do NOT change the function name
    - Parameter/return types CAN and SHOULD be changed if assembly/semantics indicate they are wrong
    - ALWAYS return a value if the function computes something - ignore Ghidra's void!
    - Do NOT introduce undefined behavior
    - Output ONLY the corrected source code, no explanations

  analysis_prompt: You are given an object containing the following fields
    - index ; The corpus index of the function.
    - original_code ; The original source code of a function.
    - optimized_code ; The optimized version of the original source code obtained through LLM optimization.
    - ghidra_code ; The decompiled code of the function obtained from Ghidra
    - test_code ; The test code to validate the function's correctness.
    - runtime_message ; The runtime error message encountered during execution.
    The original code is built to run with the provided test code, while the optimized code is intended to be as similar in functionality to the original code as possible.
    Your task is to analyze the runtime error message in the context of the provided codes.
      Create a structured JSON object to identify the error associated with the optimized code and classify it into one of the following phases
      1. Ghidra Code Issue; Errors originating from inaccuracies or limitations in Ghidra's decompilation process / if ghidra returns an inaccurate return type / argument type / argument numbers
      2. LLM Optimization Issue; Errors introduced during the optimization of the original code by the Language Model.
      3. Test Code Issue; Errors stemming from problems within the provided test code itself.
      4. Environment Issue; Errors caused by external factors such as compilation settings, library versions, or system configurations.
      5. Unknown Issue; Errors that cannot be clearly attributed.
      The values must only be one of the above five phases, worded exactly as shown.
    Based on your analysis, Create the following fields in the output object
      - index; The corpus index of the function.
      - a list of errors containing the following fields
        - error; A boolean indicating whether an error was detected (true) or not (false).
        - error_phase; One of the five phases mentioned above.
        - error_type; The specific type of error encountered. This maybe chosen from the following list of errors
          - segmentation_fault
          - null_pointer_dereference
          - buffer_overflow
          - type_mismatch
          - incorrect_return_value
          - infinite_loop
          - compilation_error
          - integer_overflow
          - floating_point_exception
          - division_by_zero
          - implicit_type_truncation
          - signedness_error
          - logic_error
          - calling_convention_mismatch
          - argument_order_mismatch
          - argument_count_mismatch
          - struct_layout_mismatch
          - decompilation_inaccuracy
          - incorrect_function_signature
          - incorrect_return_type_inference
          - incorrect_argument_type_inference
          - incorrect_argument_number_inference
          - misidentified_library_function
          - missing_include
          - assertion_failure
          - other_runtime_error
        - if the error_type is of type_mismatch, then include an object named type_mismatch_details, which is a list containing an object with the following fields
          - expected_type; The type that was expected (obtained from the original code or test code).
          - actual_type; The type that was found (obtained from the optimized code).
          - location; whether the type mismatch occurred in 'return type' or 'argument type'.
          - code_snippet; A small snippet of code (2-3 lines) from the optimized code where the type mismatch occurred.
        - error_summary; A concise summary of the error and its likely cause.
      Only return the structured object without any additional commentary or explanation.

      

